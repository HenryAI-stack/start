<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cloudplay.at — control panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0A0E14;
    --panel: #10161F;
    --panel-raised: #151D28;
    --line: #232C38;
    --line-bright: #34404F;
    --text: #E8EEF4;
    --text-dim: #7C8B9A;
    --cyan: #4CC9F0;
    --amber: #F4A261;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  html[data-theme="light"]{
    --ink: #F3F5F7;
    --panel: #FFFFFF;
    --panel-raised: #FAFBFC;
    --line: #DDE3E9;
    --line-bright: #C2CBD4;
    --text: #121821;
    --text-dim: #5B6572;
    --cyan: #0B84A5;
    --amber: #B5651D;
  }

  html, body, .module, .launch, .logo-box{
    transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100%;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 10%, rgba(76,201,240,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(244,162,97,0.04), transparent 40%);
  }

  a{ color: inherit; text-decoration: none; }

  .wrap{
    max-width: 980px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  /* ---------- Header ---------- */
  header{
    border-bottom: 1px solid var(--line);
    padding-bottom: 28px;
    margin-bottom: 36px;
  }

  .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--cyan);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .header-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .header-top .eyebrow{ margin-bottom: 0; }

  .theme-toggle{
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line-bright);
    border-radius: 20px;
    padding: 6px 14px 6px 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .theme-toggle:hover{
    border-color: var(--cyan);
    color: var(--text);
  }

  .theme-toggle:focus-visible{
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  .theme-icon{ font-size: 13px; line-height: 1; }

  .dot{
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 0 3px rgba(76,201,240,0.15);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  h1{
    font-family: var(--mono);
    font-weight: 600;
    font-size: clamp(28px, 4.4vw, 42px);
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }

  h1 .addr{ color: var(--text-dim); font-weight: 400; }

  .sub{
    color: var(--text-dim);
    font-size: 15px;
    max-width: 56ch;
    line-height: 1.55;
    margin: 0;
  }

  @keyframes reveal{
    from{ opacity: 0; transform: translateY(2px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ---------- Grid ---------- */
  .grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  @media (max-width: 700px){
    .grid{ grid-template-columns: 1fr; }
  }

  .grid-status{
    grid-column: 1 / -1;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    padding: 24px 0;
  }

  .grid-status.is-error{ color: var(--amber); }

  .toolbar{
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 18px;
  }

  .toolbar-label{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .sort-select{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line-bright);
    border-radius: 6px;
    padding: 7px 30px 7px 12px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
                       linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    transition: border-color 0.2s ease;
  }

  .sort-select:hover{ border-color: var(--cyan); }

  .sort-select:focus-visible{
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  .sort-select option{
    background: var(--panel);
    color: var(--text);
  }

  .module{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 26px 26px 22px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    opacity: 0;
    animation: reveal 0.5s ease forwards;
  }

  .module:nth-of-type(1){ animation-delay: 0.15s; }
  .module:nth-of-type(2){ animation-delay: 0.3s; }
  .module:nth-of-type(3){ animation-delay: 0.45s; }
  .module:nth-of-type(4){ animation-delay: 0.6s; }

  .module::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent, var(--cyan)), transparent 70%);
    opacity: 0.7;
  }

  .module:hover, .module:focus-within{
    border-color: var(--line-bright);
    background: var(--panel-raised);
    transform: translateY(-2px);
  }

  .module-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 12px;
  }

  .module-id{
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .logo-box{
    flex-shrink: 0;
    width: 36px;e
    height: 36px;
    border-radius: 7px;
    background: var(--panel-raised);
    border: 1px solid var(--line-bright);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .logo-box img{
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 6px;
    display: block;
  }

  .logo-box .fallback{
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--accent, var(--cyan));
    letter-spacing: 0.02em;
  }

  .code{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .status{
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent, var(--cyan));
    letter-spacing: 0.06em;
  }

  .status .led{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent, var(--cyan));
    animation: pulse 2.2s ease-in-out infinite;
  }

  .module h2{
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 8px;
  }

  .module p{
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 14px;
    min-height: 42px;
  }

  .updated{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    margin-bottom: 18px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }

  .updated.is-stale{ color: var(--amber); }
  .updated.is-error{ color: var(--text-dim); font-style: italic; }

  .launch{
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 14px 18px;
    background: transparent;
    border: 1px solid var(--line-bright);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, padding-left 0.2s ease;
  }

  .launch:hover, .launch:focus-visible{
    background: var(--accent, var(--cyan));
    color: var(--ink);
    border-color: var(--accent, var(--cyan));
    padding-left: 22px;
  }

  .launch:focus-visible{
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }

  .launch .arrow{ transition: transform 0.2s ease; }
  .launch:hover .arrow, .launch:focus-visible .arrow{ transform: translateX(3px); }

  /* ---------- Footer ---------- */
  footer{
    margin-top: 44px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
    .module{ opacity: 1; }
  }
</style>
</head>
<body>
  <div class="wrap">

    <header>
      <div class="header-top">
        <div class="eyebrow"><span class="dot"></span>ALL SYSTEMS OPERATIONAL</div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode">
          <span class="theme-icon" aria-hidden="true">☾</span>
          <span class="theme-label">DARK</span>
        </button>
      </div>
      <h1>cloudplay<span class="addr">.at</span></h1>
      <p class="sub">Internal tools, self-hosted and running quietly. Pick a module below to open it.</p>
    </header>

    <div class="toolbar">
      <label class="toolbar-label" for="sortSelect">SORT</label>
      <select class="sort-select" id="sortSelect">
        <option value="name-asc">Name (A–Z)</option>
        <option value="name-desc">Name (Z–A)</option>
        <option value="updated-desc">Recently updated</option>
        <option value="updated-asc">Least recently updated</option>
      </select>
    </div>

    <main class="grid" id="moduleGrid">
      <p class="grid-status" id="gridStatus">Loading modules…</p>
    </main>

    <footer>
      <span>cloudplay.at</span>
      <span id="moduleCount">— modules</span>
    </footer>

  </div>

  <script>
    // ---------- Theme ----------
    (function initTheme(){
      const root = document.documentElement;
      const stored = localStorage.getItem('cloudplay-theme');
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      const theme = stored || (prefersLight ? 'light' : 'dark');
      applyTheme(theme);

      document.getElementById('themeToggle').addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        applyTheme(next);
        localStorage.setItem('cloudplay-theme', next);
      });

      function applyTheme(theme){
        if (theme === 'light') root.setAttribute('data-theme', 'light');
        else root.removeAttribute('data-theme');

        const btn = document.getElementById('themeToggle');
        const icon = btn.querySelector('.theme-icon');
        const label = btn.querySelector('.theme-label');
        if (theme === 'light'){
          icon.textContent = '☀';
          label.textContent = 'LIGHT';
          btn.setAttribute('aria-label', 'Switch to dark mode');
        } else {
          icon.textContent = '☾';
          label.textContent = 'DARK';
          btn.setAttribute('aria-label', 'Switch to light mode');
        }
      }
    })();

    const ORG = 'HenryAI-stack';

    // Repos that should NOT get a tile, even though they're public.
    // Add the repo's exact name (case-sensitive) to skip it — e.g. the
    // repo that hosts this very landing page, config repos, forks you
    // don't want surfaced, archived experiments, etc.
    const EXCLUDED_REPOS = [
      'start', 'flights', 'cloudplay-landing', 'notam-worker',
      // 'cloudplay-landing',
      // 'HenryAI-stack',
    ];

    const ACCENTS = ['#4CC9F0', '#F4A261'];

    function formatTimestamp(iso){
      const d = new Date(iso);
      const datePart = d.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: '2-digit' });
      const timePart = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      const daysAgo = Math.floor((Date.now() - d.getTime()) / 86400000);
      let ago;
      if (daysAgo <= 0) ago = 'today';
      else if (daysAgo === 1) ago = '1 day ago';
      else ago = `${daysAgo} days ago`;
      return { text: `last update — ${datePart} ${timePart} (${ago})`, daysAgo };
    }

    function monogram(name){
      const parts = name.split(/[-_]/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.slice(0, 2).toUpperCase();
    }

    function escapeHtml(str){
      return str.replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function buildTile(repo, index){
      const name = repo.name;
      const accent = ACCENTS[index % ACCENTS.length];
      const desc = repo.description ? escapeHtml(repo.description) : 'No description set on GitHub yet.';
      const moduleNo = String(index + 1).padStart(2, '0');
      const { text: updatedText, daysAgo } = formatTimestamp(repo.pushed_at);

      const article = document.createElement('article');
      article.className = 'module';
      article.style.setProperty('--accent', accent);
      article.setAttribute('data-repo', name);

      article.innerHTML = `
        <div class="module-top">
          <div class="module-id">
            <span class="logo-box" data-logo><span class="fallback">${monogram(name)}</span></span>
            <span class="code">MODULE / ${moduleNo}</span>
          </div>
          <span class="status"><span class="led"></span>ONLINE</span>
        </div>
        <h2>${escapeHtml(name)}</h2>
        <p>${desc}</p>
        <div class="updated${daysAgo > 30 ? ' is-stale' : ''}">${updatedText}</div>
        <a class="launch" href="https://cloudplay.at/${encodeURIComponent(name)}">
          <span>LAUNCH</span><span class="arrow">→</span>
        </a>
      `;

      // Logo: each site's own favicon, fetched straight from GitHub Pages
      // (not through the cloudplay.at redirect, which only handles exact
      // top-level project paths).
      const logoBox = article.querySelector('[data-logo]');
      const img = new Image();
      img.alt = `${name} icon`;
      img.onload = () => { logoBox.innerHTML = ''; logoBox.appendChild(img); };
      img.onerror = () => { /* keep the monogram fallback already in the box */ };
      img.src = `https://henryai-stack.github.io/${name}/favicon.ico`;

      return article;
    }

    async function fetchRepos(){
      const headers = { 'Accept': 'application/vnd.github+json' };

      // Try as a GitHub Organization first.
      let res = await fetch(`https://api.github.com/orgs/${ORG}/repos?per_page=100&type=public`, { headers });
      if (res.status === 404){
        // Not an org — fall back to a personal user account.
        res = await fetch(`https://api.github.com/users/${ORG}/repos?per_page=100&type=public`, { headers });
      }
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }

    const SORTERS = {
      'name-asc':      (a, b) => a.name.localeCompare(b.name),
      'name-desc':     (a, b) => b.name.localeCompare(a.name),
      'updated-desc':  (a, b) => new Date(b.pushed_at) - new Date(a.pushed_at),
      'updated-asc':   (a, b) => new Date(a.pushed_at) - new Date(b.pushed_at),
    };

    let cachedRepos = [];

    function renderGrid(sortKey){
      const grid = document.getElementById('moduleGrid');
      const countEl = document.getElementById('moduleCount');
      const sorted = [...cachedRepos].sort(SORTERS[sortKey] || SORTERS['name-asc']);

      grid.innerHTML = '';

      if (sorted.length === 0){
        const empty = document.createElement('p');
        empty.className = 'grid-status';
        empty.textContent = 'No modules to show yet.';
        grid.appendChild(empty);
      } else {
        sorted.forEach((repo, i) => grid.appendChild(buildTile(repo, i)));
      }

      countEl.textContent = `${sorted.length} module${sorted.length === 1 ? '' : 's'}`;
    }

    async function loadModules(){
      const grid = document.getElementById('moduleGrid');
      const status = document.getElementById('gridStatus');
      const countEl = document.getElementById('moduleCount');
      const sortSelect = document.getElementById('sortSelect');

      const storedSort = localStorage.getItem('cloudplay-sort');
      const initialSort = SORTERS[storedSort] ? storedSort : 'name-asc';
      sortSelect.value = initialSort;

      sortSelect.addEventListener('change', () => {
        localStorage.setItem('cloudplay-sort', sortSelect.value);
        renderGrid(sortSelect.value);
      });

      try {
        const repos = await fetchRepos();

        cachedRepos = repos
          .filter(r => !r.fork && !r.archived)
          .filter(r => !EXCLUDED_REPOS.includes(r.name));

        renderGrid(initialSort);
      } catch (err) {
        status.textContent = 'Could not load modules from GitHub right now.';
        status.classList.add('is-error');
        grid.innerHTML = '';
        grid.appendChild(status);
        countEl.textContent = '— modules';
      }
    }

    loadModules();
  </script>
</body>
</html>
